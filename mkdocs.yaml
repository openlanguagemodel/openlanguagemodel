site_name: OpenLanguageModel (OLM)
site_url: https://openlanguagemodel.github.io/openlanguagemodel/

repo_url: https://github.com/openlanguagemodel/openlanguagemodel
repo_name: openlanguagemodel/openlanguagemodel

theme:
    name: material
    palette:
        # Light mode
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: blue grey
          accent: blue
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode
        # Dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: blue grey
          accent: blue
          toggle:
              icon: material/brightness-4
              name: Switch to light mode
    font:
        text: Inter
        code: JetBrains Mono
    features:
        - navigation.instant
        - navigation.tracking
        - navigation.tabs
        - navigation.sections
        - navigation.expand
        - navigation.top
        - search.suggest
        - search.highlight
        - content.code.copy
        - content.code.annotate

markdown_extensions:
    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences
    - pymdownx.tabbed:
          alternate_style: true
    - pymdownx.details
    - admonition
    - attr_list
    - md_in_html
    - tables
    - toc:
          permalink: true

extra_css:
    - stylesheets/extra.css

nav:
    - Home: index.md
    - API Reference: api.md
