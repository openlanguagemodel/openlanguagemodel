[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openlanguagemodel"
version = "2.1"
description = "OpenLanguageModel (OLM): a modular PyTorch LLM library for building, training, teaching, and researching transformer language models."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Tavish Mankash"},
    {name = "Vardhaman Kalloli"},
    {name = "Keshava Prasad"},
]
keywords = [
    "deep learning",
    "machine learning",
    "language models",
    "transformers",
    "pytorch",
    "llm",
    "llm training",
    "transformer architecture",
    "distributed training",
    "fineweb-edu",
    "education",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0",
    "tqdm>=4.60.0",
    "pyyaml>=6.0",
    "transformers>=4.57.1",
    "datasets>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
    "build",
    "twine",
]
flash = [
    "flash-attn>=2.0.0",
]
wandb = [
    "wandb>=0.16.0",
]

[project.urls]
Homepage = "https://openlanguagemodel.github.io/openlanguagemodel/"
Documentation = "https://openlanguagemodel.github.io/openlanguagemodel/docs/"
Repository = "https://github.com/openlanguagemodel/openlanguagemodel"
Issues = "https://github.com/openlanguagemodel/openlanguagemodel/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["olm*"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
