[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openlanguagemodel"
description = "OpenLanguageModel (OLM): a modular PyTorch LLM library for building, training, teaching, and researching transformer language models."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Tavish Mankash"},
    {name = "Vardhaman Kalloli"},
    {name = "Keshava Prasad"},
]
keywords = [
    "deep learning",
    "machine learning",
    "language models",
    "transformers",
    "pytorch",
    "llm",
    "llm training",
    "transformer architecture",
    "distributed training",
    "fineweb-edu",
    "education",
]
dynamic = ["version"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # torch.amp.GradScaler (used in olm.train.trainer) was added in torch 2.3.0.
    "torch>=2.3.0",
    # numpy 1.20.x ships no cp310 wheels; 1.21.2 is the first release that
    # supports this project's minimum Python (3.10).
    "numpy>=1.21.2",
    "tqdm>=4.62.1",
    "pyyaml>=6.0",
    "transformers>=4.57.1",
    # datasets < 2.16 imports `HfFolder` from huggingface_hub, which hub 1.0
    # removed, and those releases declare no upper bound on hub -- so a resolver
    # picks a modern hub and the import dies. (< 2.15 additionally uses the
    # removed pyarrow.PyExtensionType.)
    "datasets>=2.16.0",
]

[project.optional-dependencies]
dev = [
    "setuptools>=77.0",
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "sphinx>=7.0.0",
    "sphinx-markdown-builder>=0.6.0",
    "build",
    "twine",
]
wandb = [
    "wandb>=0.16.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-markdown-builder>=0.6.0",
]

[project.urls]
Homepage = "https://openlanguagemodel.github.io/openlanguagemodel/"
Documentation = "https://openlanguagemodel.github.io/openlanguagemodel/docs/"
Repository = "https://github.com/openlanguagemodel/openlanguagemodel"
Issues = "https://github.com/openlanguagemodel/openlanguagemodel/issues"
"Release Notes" = "https://openlanguagemodel.github.io/openlanguagemodel/docs/release-v2.2.0/"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "olm.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["olm*"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = [
    ".git",
    ".venv",
    "build",
    "dist",
    "website",
    "claude_bkp",
]
