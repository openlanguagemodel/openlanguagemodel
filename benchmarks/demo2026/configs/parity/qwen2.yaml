# Tiny Qwen-2.5-style parity configuration.
# Compared against transformers.Qwen2ForCausalLM built from Qwen2Config.
family: qwen2
model:
  vocab_size: 257
  embed_dim: 64
  intermediate_size: 176
  num_layers: 4
  num_heads: 4
  num_kv_heads: 2
  max_seq_len: 64
  rope_theta: 1000000.0
  dropout: 0.0
  rms_norm_eps: 1.0e-6
  tie_weights: true
batch:
  batch_size: 4
  seq_len: 32
seeds: [11, 22, 33]
gradient_probes:
  embedding: blocks.0.embedding.weight
  early: blocks.1.stack.0.blocks.0.block.blocks.1.q_proj.weight
  late: blocks.1.stack.3.blocks.1.block.blocks.1.up_proj.weight
