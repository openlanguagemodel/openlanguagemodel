# GPT-2 124M Training on FineWeb Edu 10B Tokens
# Target: 3.28 validation loss

# Model Configuration
model:
    name: gpt2
    vocab_size: 50257
    embed_dim: 768
    num_layers: 12
    num_heads: 12
    max_seq_len: 1024
    dropout: 0.1

# Dataset Configuration
data:
    dataset: "HuggingFaceFW/fineweb-edu"
    subset: "sample-10BT" # 10B token sample
    split_train: 0.99
    split_val: 0.01
    context_length: 1024
    num_workers: 4
    cache_dir: "./data_cache"

# Training Configuration
training:
    # Total tokens: 10B, context: 1024, effective batch: 524288 tokens
    # Steps = 10B / 524288 ≈ 19073
    max_steps: 19073

    # Batch configuration
    batch_size: 16 # Per device
    gradient_accumulation_steps: 8 # Effective batch = 128 sequences = 131072 tokens per GPU

    # Multi-GPU (if available)
    num_gpus: 1 # Adjust based on hardware
    # Effective global batch = 16 * 8 * 4 = 512 sequences = 524288 tokens

    # Mixed precision
    use_amp: true
    dtype: "bfloat16" # Better for LLMs than float16

    # Compilation
    compile: false # Set true for torch.compile speedup (requires PyTorch 2.0+)

    # Device
    device: "cuda"

# Optimizer Configuration
optimizer:
    type: "adamw"
    lr: 6.0e-4 # Standard GPT-2 learning rate
    betas: [0.9, 0.95]
    weight_decay: 0.1
    eps: 1.0e-8
    fused: false # Set true if available for speedup

# Learning Rate Schedule
scheduler:
    type: "cosine"
    warmup_steps: 1000 # ~5% of training
    min_lr: 6.0e-5 # 10% of max_lr

# Gradient Clipping
grad_clip:
    enabled: true
    max_norm: 1.0

# Checkpointing
checkpoint:
    save_every: 1000 # Save every 1000 steps
    keep_last_n: 5 # Keep last 5 checkpoints
    save_optimizer: true # Save optimizer state for resuming

# Evaluation
eval:
    eval_every: 500 # Evaluate every 500 steps
    eval_steps: 100 # Number of eval batches

# Logging
logging:
    log_every: 10 # Log metrics every 10 steps
    log_file: "logs/training.log"
    save_metrics: true # Save metrics to JSON lines

# Reproducibility
seed: 42

# System
num_workers: 4 # DataLoader workers
pin_memory: true
