name: Bug report
description: Report something that is broken or behaving unexpectedly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. A small reproduction helps us fix bugs much faster.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Paste the smallest code example, command, or notebook cell that reproduces the issue.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OLM version
      placeholder: "2.2.0, main, or a commit hash"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.10, 3.11, or 3.12"
  - type: input
    id: torch
    attributes:
      label: PyTorch version
      placeholder: "torch.__version__"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - models
        - nn components
        - training
        - data/tokenization
        - distributed training
        - docs/website
        - packaging/install
        - other
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Paste the full traceback or relevant logs.
      render: text
