name: Python package

on:
  push:
    branches: [main, dev]
  # CONTRIBUTING directs all pull requests at `dev`, so listing only `main` here
  # meant no contribution was ever tested before it was merged.
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  tests:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile source
        run: python -m compileall -q src tests scripts
      - name: Run tests
        run: python -m pytest -q tests

  minimum-versions:
    name: Tests on minimum declared dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v5
      # A stale uv.lock cannot be consumed reproducibly: `uv sync --locked` fails
      # and `--frozen` silently keeps the old metadata.
      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check
      # The `tests` job always resolves the newest releases, so a dependency floor
      # declared lower than the code actually needs goes unnoticed. This job pins
      # every direct dependency to its declared minimum instead.
      - name: Install minimum declared dependency versions
        run: uv pip install --system --resolution lowest-direct -e ".[dev]"
      - name: Show resolved versions
        run: |
          python -c "import torch; print('torch', torch.__version__)"
          python -c "import numpy; print('numpy', numpy.__version__)"
          python -c "import datasets, transformers; print('datasets', datasets.__version__); print('transformers', transformers.__version__)"
      - name: Run tests
        run: python -m pytest -q tests

  package:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
